<main>
<div class="card">
<span class="tag">新手入門</span>
<h2>象山｜台北城市中的自然步道</h2>
<img src="IMG_5997.jpeg" alt="象山登山風景" style="width:100%;height:auto;border-radius:12px;">
<p>象山位於台北市信義區，是台北著名的親山步道。沿途可欣賞台北101及城市天際線，尤其在日落時分，景色十分迷人。</p>
</div>
<div class="card">
<h2>登山路線特色</h2>
<ul>
<li>地點：台北市信義區</li>
<li>難度：新手入門，但有連續階梯</li>
<li>景觀：台北101、六巨石、城市夜景</li>
<li>特色：交通便利，適合短時間登山健行</li>
</ul>
</div>
<div class="card">
<h2>登山注意事項</h2>
<p>建議穿著止滑且合腳的鞋子，攜帶飲水。雨後石階可能濕滑，夏季則需注意高溫與補水。</p>
</div>
